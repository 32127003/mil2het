name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - py_module
  workflow_dispatch:

jobs:
  pytest-cpu:
    name: py${{ matrix.python-version }} torch${{ matrix.torch-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            torch-version: "2.3.1"
          - python-version: "3.10"
            torch-version: "2.5.1"
          - python-version: "3.11"
            torch-version: "2.5.1"
          - python-version: "3.11"
            torch-version: "2.7.1"
          - python-version: "3.12"
            torch-version: "2.7.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build pytest

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Install scbiomarker wheel
        run: |
          python -m pip install dist/*.whl

      - name: Install CPU torch
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==${{ matrix.torch-version }}"

      - name: Install CPU torch-scatter
        run: |
          python -m pip install --no-build-isolation torch-scatter \
            -f "https://data.pyg.org/whl/torch-${{ matrix.torch-version }}+cpu.html"

      - name: Prepare wheel validation workspace
        run: |
          mkdir -p /tmp/scbiomarker-wheel-tests

      - name: Import probe
        run: |
          cd /tmp/scbiomarker-wheel-tests
          python - <<'PY'
          import scbiomarker
          import torch
          import torch_scatter
          print("scbiomarker", scbiomarker.__file__)
          print("torch", torch.__version__, torch.version.cuda)
          print("torch_scatter", torch_scatter.__version__)
          PY

      - name: Run pytest CPU suite
        run: |
          cd /tmp/scbiomarker-wheel-tests
          python -m pytest -c "$GITHUB_WORKSPACE/pyproject.toml" "$GITHUB_WORKSPACE/tests" --cpu-only -q
