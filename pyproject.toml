[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scbiomarker"
version = "0.1.0"
description = "Single-cell biomarker modeling and analysis toolkit."
requires-python = ">=3.10"

dependencies = [
  "numpy>=1.21,<2",
  "pandas>=1.4,<3",
  "PyYAML>=6,<7",
  "scipy>=1.8,<2",
  "scikit-learn>=1.0,<2",
  "anndata>=0.9,<0.11",
  "scanpy>=1.9,<1.11",
]

[project.optional-dependencies]
encoder = [
  "torch>=1.12,<3",
  "torch-scatter>=2.1,<3",
]

[project.scripts]
scbiomarker = "scbiomarker.cli:main"

[tool.setuptools]
py-modules = ["network_propagation"]

[tool.setuptools.package-data]
scbiomarker = ["*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scbiomarker*", "modules*", "configs*", "scripts*"]
exclude = ["data*", "experiment_asthma_find*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["smoke_test_*.py"]
markers = [
  "gpu: requires actual CUDA execution and is skipped when --cpu-only is used",
]
