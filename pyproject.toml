[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scbiomarker"
version = "0.1.0"
description = "Single-cell biomarker modeling and analysis toolkit."
requires-python = ">=3.10"

dependencies = [
  "numpy==1.26.1",
  "pandas==2.0.3",
  "PyYAML>=6,<7",
  "scipy==1.15.3",
  "scikit-learn==1.7.2",
  "umap-learn==0.5.11",
  "pynndescent==0.6.0",
  "anndata==0.9.2",
  "h5py==3.10.0",
  "scanpy==1.9.6",
  "tqdm==4.66.1",
]

[project.optional-dependencies]
encoder = [
  "torch==2.3.1",
  "torch-geometric",
  "torch-scatter",
]
protein = [
  "accelerate>=0.32,<2",
  "httpx",
  "esm==3.2.1.post1",
]

[tool.setuptools]
py-modules = ["network_propagation"]

[tool.setuptools.package-data]
scbiomarker = ["*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scbiomarker*", "modules*", "configs*", "scripts*"]
exclude = ["data*", "experiment_asthma_find*"]
