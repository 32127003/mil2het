[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mil2het"
version = "0.1.0"
description = "Single-cell biomarker modeling and analysis toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "mil2het contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "numpy>=1.21,<2",
  "pandas>=1.4,<3",
  "PyYAML>=6,<7",
  "scipy>=1.8,<2",
  "scikit-learn>=1.0,<2",
  "anndata>=0.9,<0.11",
  "scanpy>=1.9,<1.11",
]

[project.optional-dependencies]
encoder = [
  "torch>=1.12,<3",
  "torch-scatter>=2.1,<3",
]

[project.scripts]
mil2het = "mil2het.cli:main"

[project.urls]
Homepage = "https://github.com/32127003/scbiomarker"
Repository = "https://github.com/32127003/scbiomarker"
Issues = "https://github.com/32127003/scbiomarker/issues"
Documentation = "https://32127003.github.io/scbiomarker/"

[tool.setuptools]
py-modules = ["network_propagation"]

[tool.setuptools.package-data]
mil2het = ["*.yaml"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mil2het*", "modules*", "configs*", "scripts*"]
exclude = ["data*", "experiment_asthma_find*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["smoke_test_*.py", "test_*.py"]
markers = [
  "unit: fast contract or helper tests",
  "integration: exercises multiple workflow phases",
  "slow: long-running training, analysis, or signal-recovery tests",
  "gpu: requires actual CUDA execution and is skipped when --cpu-only is used",
  "signal: validates recovery of planted synthetic biology signal",
  "negative: expected fail-fast contract tests",
]
